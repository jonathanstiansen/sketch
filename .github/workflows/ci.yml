name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"
  NODE_VERSION: "24"

jobs:
  elixir-static:
    name: Format, compile, Credo, Dialyzer, migrations
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-test-${{ hashFiles('mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors --force
      - run: mix sketch.gen.manifest --check
      - run: mix sketch.gen.render_fixtures --check
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix ash.codegen --check

  typescript:
    name: TypeScript and ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            assets/package-lock.json
            e2e/package-lock.json
      - run: mix deps.get
      - run: npm ci --prefix assets
      - run: npm ci --prefix e2e
      - run: npm --prefix assets run typecheck
      - run: npm --prefix assets run lint
      - run: npm --prefix assets test
      - run: npm --prefix e2e run typecheck
      - run: npm --prefix e2e run lint
      - name: Build assets with esbuild
        run: mix do assets.setup, assets.build

  test:
    name: Architecture, unit and PostgreSQL integration tests
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-test-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: npm ci --prefix assets
      - run: mix test --warnings-as-errors

  e2e:
    name: Two-browser Playwright tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-dev-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix do ash.setup, assets.setup
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - run: npm --prefix e2e test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  compose-smoke:
    name: Docker Compose deployment smoke tests
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: http://127.0.0.1:4000
      DEPLOY_STATE_FILE: /tmp/deploy-state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: Create .env with throwaway test values
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 16)"
            echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"
            echo "PHX_HOST=127.0.0.1"
            echo "APP_PORT=4000"
          } > .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Services are healthy and migrations completed
        run: |
          docker compose ps --all
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")" = healthy
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all -q migrate)")" = 0
          curl --fail --silent "$E2E_BASE_URL/healthz"
      - name: PostgreSQL is not published and the app is bound to loopback
        run: |
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose ps -q db)")" = "{}"
          test "$(docker compose port app 4000)" = "127.0.0.1:4000"
      - name: Two-browser E2E against the container
        run: npm --prefix e2e test
      - name: Commit a change to survive restarts
        run: DEPLOY_PHASE=seed npm --prefix e2e test -- deploy-persistence
      - name: Change survives docker compose restart
        run: |
          docker compose restart app
          docker compose up -d --wait app
          DEPLOY_PHASE=verify npm --prefix e2e test -- deploy-persistence
      - name: Change survives container recreation
        run: |
          docker compose up -d --force-recreate --wait app
          DEPLOY_PHASE=verify npm --prefix e2e test -- deploy-persistence
      - name: Change survives down and up with the volume kept
        run: |
          docker compose down
          docker compose up -d --wait
          DEPLOY_PHASE=verify npm --prefix e2e test -- deploy-persistence
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  complexity:
    name: Complexity of new TypeScript functions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lizard
        run: python3 -m pip install --quiet lizard==1.25.0
      - name: Check base and head
        id: check
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          python3 tools/complexity/check.py --base "$RUNNER_TEMP/base" --head . --report "$RUNNER_TEMP/report.md"
      - name: Post or update the PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT: ${{ runner.temp }}/report.md
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.REPORT)) return;
            const body = fs.readFileSync(process.env.REPORT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes('<!-- complexity-report -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail on new or growing complex functions
        if: steps.check.outcome == 'failure'
        run: exit 1
