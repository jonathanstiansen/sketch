name: sketch

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sketch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sketch
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketch -d sketch"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: /app/bin/migrate
    restart: "no"
    environment:
      DATABASE_URL: ecto://sketch:${POSTGRES_PASSWORD}@db/sketch
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      PHX_HOST: ${PHX_HOST:-localhost}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ecto://sketch:${POSTGRES_PASSWORD}@db/sketch
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      BIND_IP: 0.0.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
